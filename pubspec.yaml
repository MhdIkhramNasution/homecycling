name: homecycling
description: "Food waste and managing inventory"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  image_picker: ^1.0.7
  http: ^1.2.0
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  shared_preferences: ^2.2.2
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/navbar/
    - assets/model/
